<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

<h1>Novell Services Login</h1>
<label for="na">Name:</label>
<input type="text" name="Name" id="na"> <br> <br>
    <label for="pass">Password:</label>
    <input type="text" name="P" id="pass"> <br> <br>
    <label for="city">City of Employment:</label>
    <input type="text" name="cii" id="city"> <br> <br>
<label for="Web">Web Server:</label>
<select>
    <option value="Choose a server">-Choose  a server-</option>
</select> <br> <br>
<p>Please specify your role:</p>
<label for="Role">Admin</label>
<input type="radio" name="Admin" id="Role">
<label for="Engin">Engineer</label>
<input type="radio" name="Admin" id="Engin">
<label for="Mana">Manager</label>
<input type="radio" name="Admin" id="Mana">
<label for="G">Guest</label>
<input type="radio" name="Admin" id="G">  <br> <br>
<p>Single Sign-on to the following:</p>
<label for="Ma">Mail</label>
<input type="radio" name="Mail" id="Ma">
<label for="Pa">Payroll</label>
<input type="radio" name="Mail" id="Pa">
<label for="Se">Self-Service</label>
<input type="radio" name="Mail" id="Se"> <br> <br>
<button>Login</button>
<button>Reset</button>

</body>
</html>
